id: payments
name: Online payments
version: "1.3.0"
hubra: ">=0.2.2,<1"
description: "Members pay their invoices online by card or TWINT. The club connects its own Stripe account (Stripe Connect), the money goes straight to the club and the invoice is marked paid by itself."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-payments
license: AGPL-3.0-or-later
tags: [finance, payments, twint, stripe]
package: hubra_payments
modules: [payments]
requires: [members, finance]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, jobs, contracts, frontend]
